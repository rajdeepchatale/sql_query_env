[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-sql_query_env"
version = "0.1.0"
description = "SQL query generation environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "sql_query_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["sql_query_env", "sql_query_env.server"]
package-dir = { "sql_query_env" = ".", "sql_query_env.server" = "server" }